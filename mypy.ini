[mypy]
python_version = 3.11
ignore_missing_imports = true
cache_dir = /tmp/coc-mypy-cache

# These modules are transport/legacy boundaries whose SDKs and dynamic JSON
# payloads do not ship usable stubs. Core game, persistence, combat and model
# modules remain checked normally; the adapters are covered by the runtime
# integration and unit-test suites.
[mypy-app.legacy_commands]
ignore_errors = true

[mypy-app.commands.handlers.system]
ignore_errors = true

[mypy-app.commands.router]
ignore_errors = true

[mypy-app.main]
ignore_errors = true

[mypy-app.discord_bot]
ignore_errors = true
