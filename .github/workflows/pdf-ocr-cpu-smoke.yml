name: PDF OCR CPU smoke

on:
  pull_request:
    paths:
      - 'app/pdf*.py'
      - 'requirements-pdf-ocr.txt'
      - 'scripts/setup_pdf_ocr.py'
      - 'scripts/experiments/smoke_pdf_ocr_cpu.py'
      - '.github/workflows/pdf-ocr-cpu-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pdf-ocr.txt
      - run: python -m pip install -r requirements-pdf-ocr.txt python-dotenv
      - uses: actions/cache@v4
        id: models
        with:
          path: ~/.cache/coc-pdf-ocr
          key: pdf-ocr-linux-v5-mobile-${{ hashFiles('requirements-pdf-ocr.txt', 'scripts/setup_pdf_ocr.py') }}
      - name: Explicit model setup
        if: steps.models.outputs.cache-hit != 'true'
        run: python scripts/setup_pdf_ocr.py --models-dir "$HOME/.cache/coc-pdf-ocr" --skip-install
      - name: Offline runtime CPU smoke
        env:
          PDF_OCR_PADDLE_ENABLED: 'true'
          PDF_OCR_PADDLE_DEVICE: cpu
        run: |
          export PDF_OCR_PADDLE_MODELS_PATH="$HOME/.cache/coc-pdf-ocr"
          export PDF_OCR_PADDLE_PYTHON="$(command -v python)"
          python scripts/experiments/smoke_pdf_ocr_cpu.py --report pdf-ocr-linux-cpu-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-ocr-linux-cpu-smoke
          path: pdf-ocr-linux-cpu-smoke.json
