# Tooling config only; this repo is not an installable package.
# mypy settings live in mypy.ini, pytest settings in pytest.ini.

[tool.ruff.lint]
# Ruff's default rule set, pinned by the exact ruff version in
# requirements-dev.txt, plus cross-module private access
# (CODING_STANDARDS.md, "Private stays private").
extend-select = ["SLF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]
"scripts/experiments/**" = ["SLF001"]
# Existing SLF001 debt. Delete a line once its file is clean; add none.
